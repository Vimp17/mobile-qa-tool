[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-tool"
version = "0.2.0"
description = "Автоматическая базовая проверка Android-сборок для QA: статика APK, эмулятор, Maestro, отчёт, Google Таблицы"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "Jinja2>=3.1",
  "cryptography>=41",
  "Pillow>=10",
  "requests>=2.31,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6", "google-auth>=2.20"]
dev = ["pytest>=8"]

[project.scripts]
qa = "qa_tool.cli:main"

[tool.setuptools.packages.find]
include = ["qa_tool*"]

[tool.setuptools.package-data]
qa_tool = ["report/*.j2", "templates/*", "templates/**/*", "templates/dot_maestro/smoke/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
